version: '3.8'

services:
  app:
    image: ghcr.io/purpleturtle1988/inspiration-board:latest
    container_name: inspiration-board
    ports:
      - "9467:3000"
    volumes:
      - inspiration-data:/data
      - inspiration-uploads:/uploads
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/inspiration.db
      - UPLOADS_PATH=/uploads
    restart: unless-stopped

volumes:
  inspiration-data:
  inspiration-uploads:
