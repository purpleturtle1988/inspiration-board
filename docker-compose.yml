version: '3.8'

services:
  app:
    build: .
    container_name: inspiration-board
    ports:
      - "9467:3000"
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/inspiration.db
      - UPLOADS_PATH=/uploads
    restart: unless-stopped
