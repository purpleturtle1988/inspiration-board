<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #141414;
      color: #fff;
    }

    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .header p {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 2px;
    }

    .body { padding: 14px 16px; }

    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #fff;
      outline: none;
      transition: border-color 0.15s;
    }
    input::placeholder { color: rgba(255,255,255,0.2); }
    input:focus { border-color: rgba(245,158,11,0.5); }

    .hint {
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      background: #f59e0b;
      color: #000;
      font-weight: 700;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      padding: 9px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #fbbf24; }
    button:active { background: #d97706; }

    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      height: 16px;
      color: #34d399;
    }
    .status.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <img src="icon.png" width="20" height="20" alt="" />
      <h1>Inspiration Board</h1>
    </div>
    <p>Rechtsklick auf Bilder → zur Inbox senden</p>
  </div>

  <div class="body">
    <label>Server-URL</label>
    <input
      id="url"
      type="url"
      placeholder="http://192.168.1.100:9467"
    />
    <p class="hint">Adresse deiner Synology + Port 9467</p>

    <button id="save">Speichern</button>
    <div class="status" id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
